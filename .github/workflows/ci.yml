name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod/go.sum are tidy
        run: go mod tidy -diff

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      # The store speaks two dialects and a deployment runs this one. A statement that
      # is valid in SQLite and not here compiles, lints and passes the SQLite pass, so
      # without a server in CI the first execution is in production.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wac
          POSTGRES_PASSWORD: wac
          POSTGRES_DB: wac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # miniredis stands in for Redis everywhere else and cannot stand in here: it
      # answers zero for `entries-added` and `entries-read`, the two counters that say
      # whether a MAXLEN trim took commands the consumer group was never handed. Against
      # the double that diagnosis is correctly silent, which means it is never exercised.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      # The same suite, against the other dialect. Everything rather than the one
      # package that holds SQL today: "SQL only lives in internal/store" is a
      # convention nothing enforces, and an unenforced convention about SQL is what
      # left this gap in the first place.
      #
      # Without -race: this pass is about what the server accepts, and the race
      # detector has already had its say on the same code a step earlier.
      - name: Run tests against PostgreSQL
        env:
          WAC_TEST_DATABASE_URL: postgres://wac:wac@localhost:5432/wac?sslmode=disable
        run: go test -count=1 ./...

      # The transport against a real server, for the counters miniredis does not keep.
      # Its own database index, so nothing here shares state with the smoke job.
      - name: Run the transport against Redis
        env:
          WAC_TEST_REDIS_URL: redis://localhost:6379/15
        run: go test -count=1 ./internal/transport/redisstream

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: error
          retention-days: 7

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built, not pushed: the point is that a change cannot break the release build
      # without CI saying so on the pull request that made it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: connector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # And that it comes up. An image that builds is not an image that runs: Docker
      # creates the path a VOLUME names, owns it as root, and this image runs as nonroot,
      # so the first write to the cache or to the SQLite store is what decides whether an
      # operator gets a connector or a container that exits on boot. Nothing short of
      # starting it with the volume attached sees that.
      - name: It comes up with its own volume attached
        run: |
          docker network create smoke-net
          docker run -d --name smoke-redis --network smoke-net redis:8-alpine
          docker run -d --name smoke --network smoke-net -v smoke-data:/data \
            -e REDIS_URL=redis://smoke-redis:6379/0 \
            -e WAC_ENGINE=whatsmeow \
            -e WAC_DATABASE_URL=sqlite:/data/wa.db \
            -e WAC_MEDIA_ROOT=/data/media \
            -e WAC_MEDIA_TOKEN=smoke \
            -e WAC_INSTANCE=smoke \
            connector:ci
          for _ in $(seq 30); do
            if docker exec smoke /connector healthcheck >/dev/null 2>&1; then
              echo "the connector answers its own healthcheck"
              exit 0
            fi
            sleep 1
          done
          echo "it never came up:"
          docker logs smoke
          exit 1
