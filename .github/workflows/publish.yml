name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without the leading v)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The floating major tag is what the compose file pins, so a deployment picks up
      # a protocol hotfix on its next pull without an operator editing anything.
      - name: Derive the tags
        id: tags
        run: |
          version="${{ steps.version.outputs.value }}"
          major="${version%%.*}"
          minor="${version%.*}"
          image=ghcr.io/${{ github.repository }}
          {
            echo "value<<EOF"
            echo "$image:$version"
            echo "$image:$minor"
            echo "$image:$major"
            echo "$image:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
