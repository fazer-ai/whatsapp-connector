version: "2"

# The live suite is behind `//go:build live`, so without this every file that drives a
# real account -- where the trickiest code in this repo lives -- is outside the analysis.
# Set here rather than on the CI step so it holds for `make lint`, the git hooks, and
# anyone running the binary by hand: a lint that only the remote enforces is one that
# finds things after they are pushed, which is how a `paramTypeCombine` reached main.
run:
  build-tags:
    - live

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    rules:
      # Tests read fixtures from the repo and assert on them; the file-inclusion and
      # unhandled-close warnings there are noise.
      - path: _test\.go$
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fazer-ai/whatsapp-connector
